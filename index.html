<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>∞ Infinite ∞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cinzel+Decorative:wght@700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#06030f;--ink2:#0d0720;
  --gold:#f5cf73;--gold2:#c8912f;--gold3:#fff1c4;
  --vio:#8b5cf6;--vio2:#c084fc;--cyan:#5eead4;--rose:#fb7185;
  --txt:#efe7ff;--mut:#a99cc8;--line:rgba(245,207,115,.18);--line2:rgba(192,132,252,.25);
  --glass:rgba(20,12,40,.55);--glass2:rgba(30,18,60,.45);
  --r:18px;
}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--ink);color:var(--txt);font-family:'Tajawal',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;padding-bottom:84px}
button,input,select,textarea{font-family:inherit}
img{display:block}

/* ===== BACKDROP ===== */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.bgimg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;opacity:.22;filter:saturate(1.2);pointer-events:none}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(80px);opacity:.55}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vw;height:46vw;background:#5b21b6;top:5%;right:10%}
.aurora i:nth-child(2){width:38vw;height:38vw;background:#9d174d;bottom:5%;left:8%;animation-duration:28s}
.aurora i:nth-child(3){width:30vw;height:30vw;background:#0e7490;top:40%;left:40%;animation-duration:34s;opacity:.6}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,-4vh) scale(1.15)}100%{transform:translate(-5vw,5vh) scale(.95)}}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.75) 100%)}

/* ===== TOPBAR ===== */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:12px clamp(14px,3vw,34px);background:linear-gradient(180deg,rgba(6,3,15,.92),rgba(6,3,15,.55));backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;min-width:0}
.brand .av{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(245,207,115,.15),0 0 24px rgba(245,207,115,.45);animation:pulseG 3.5s ease-in-out infinite}
@keyframes pulseG{50%{box-shadow:0 0 0 6px rgba(245,207,115,.06),0 0 36px rgba(245,207,115,.7)}}
.brand .bt{font-family:'Cinzel Decorative',serif;font-size:20px;font-weight:900;letter-spacing:1px;white-space:nowrap}
.brand .bs{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{position:relative;padding:9px 11px;border-radius:12px;color:var(--mut);font-weight:700;font-size:15px;cursor:pointer;transition:.25s;user-select:none}
.nav a:hover{color:var(--txt);background:rgba(255,255,255,.05)}
.nav a.on{color:var(--ink);background:linear-gradient(135deg,var(--gold3),var(--gold),var(--gold2));box-shadow:0 6px 24px rgba(245,207,115,.35)}
.adm-pill{display:none;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(94,234,212,.12);color:var(--cyan);border:1px solid rgba(94,234,212,.35);cursor:pointer;white-space:nowrap}
body.admin .adm-pill{display:flex}
body.editing .adm-pill{background:rgba(251,113,133,.15);color:var(--rose);border-color:rgba(251,113,133,.5)}

/* mobile nav */
.mnav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:none;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(8,4,20,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.mnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--mut);padding:5px 3px;flex:1;min-width:0;white-space:nowrap;border-radius:12px;transition:.2s;cursor:pointer}
.mnav a b{font-size:20px;line-height:1;transition:.3s}
.mnav a.on{color:var(--gold)}
.mnav a.on b{transform:translateY(-3px) scale(1.15);filter:drop-shadow(0 0 8px var(--gold))}
@media(max-width:1100px){.nav{display:none}.mnav{display:flex}.mnav a b{font-size:18px}.brand .bt{font-size:17px}}

/* ===== LAYOUT ===== */
main{position:relative;z-index:2;overflow-x:clip;max-width:1500px;margin:0 auto;padding:clamp(16px,3vw,36px)}
.sec{display:none}
.sec.on{display:block;animation:secIn .6s cubic-bezier(.2,.8,.2,1)}
@keyframes secIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.h2{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 22px}
.h2 h2{font-family:'Aref Ruqaa',serif;font-size:clamp(30px,4.5vw,46px);line-height:1.2;background:linear-gradient(90deg,var(--gold3),var(--gold),var(--vio2),var(--gold));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s linear infinite}
.h2 p{color:var(--mut);font-size:15px;margin-top:2px}
@keyframes shimmer{to{background-position:300% 0}}

.card{position:relative;background:var(--glass);border:1px solid var(--line2);border-radius:var(--r);padding:20px;backdrop-filter:blur(12px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(245,207,115,.6),transparent 35%,transparent 65%,rgba(192,132,252,.6));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}

/* ===== HERO ===== */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;min-height:min(78vh,720px)}
@media(max-width:900px){.hero{grid-template-columns:1fr;text-align:center;min-height:auto;padding-top:6px}}
.kick{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(245,207,115,.07);color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.5px}
.kick::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.hero h1{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(46px,8vw,104px);line-height:1;margin:18px 0 6px;letter-spacing:2px;background:linear-gradient(180deg,#fff 0%,var(--gold3) 30%,var(--gold) 60%,var(--gold2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px rgba(245,207,115,.35))}
.hero .sub{font-family:'Aref Ruqaa',serif;font-size:clamp(26px,3.6vw,40px);color:var(--vio2);text-shadow:0 0 30px rgba(192,132,252,.5)}
.hero .txt{color:var(--mut);font-size:clamp(15px,1.6vw,18px);margin:16px 0 26px;line-height:1.9;max-width:560px}
@media(max-width:900px){.hero .txt{margin-inline:auto}}
.cta{display:flex;gap:12px;flex-wrap:wrap}
@media(max-width:900px){.cta{justify-content:center}}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:14px;border:0;cursor:pointer;font-weight:800;font-size:16px;color:var(--ink);background:linear-gradient(135deg,var(--gold3),var(--gold) 45%,var(--gold2));box-shadow:0 10px 30px rgba(245,207,115,.3),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .2s,box-shadow .2s}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(245,207,115,.45)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--txt);border:1px solid var(--line2);box-shadow:none}
.btn.ghost::after{display:none}
.btn.ghost:hover{border-color:var(--vio2);background:rgba(192,132,252,.1)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:11px}
.btn.red{background:linear-gradient(135deg,#fda4af,#e11d48);color:#fff}
.btn.cy{background:linear-gradient(135deg,#a7f3d0,#14b8a6);color:#042f2e}

.emb-wrap{position:relative;aspect-ratio:1;width:min(100%,520px);margin:auto;display:grid;place-items:center}
.ring{position:absolute;border-radius:50%;border:1px dashed rgba(245,207,115,.35);animation:spin 40s linear infinite}
.ring.r1{inset:0}
.ring.r2{inset:7%;border:1px solid rgba(192,132,252,.3);animation-duration:26s;animation-direction:reverse}
.ring.r3{inset:14%;border:2px dotted rgba(245,207,115,.25);animation-duration:60s}
.ring svg{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px)}
@keyframes spin{to{transform:rotate(360deg)}}
.orb{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 18px 4px var(--gold);top:-6px;left:calc(50% - 6px)}
.ring.r2 .orb{background:var(--vio2);box-shadow:0 0 18px 4px var(--vio2)}
.emb{position:relative;width:70%;aspect-ratio:1;border-radius:28px;overflow:hidden;animation:float 6s ease-in-out infinite;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 90px rgba(139,92,246,.35)}
.emb img{width:100%;height:100%;object-fit:cover}
.emb::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.25) 45%,transparent 60%);background-size:250% 100%;animation:gloss 5s ease-in-out infinite}
@keyframes gloss{0%,40%{background-position:150% 0}100%{background-position:-100% 0}}
@keyframes float{50%{transform:translateY(-14px) rotate(.6deg)}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:10px 0 40px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{text-align:center;padding:18px 10px}
.stat .v{font-family:'Cinzel Decorative',serif;font-size:clamp(28px,4vw,40px);font-weight:900;color:var(--gold);text-shadow:0 0 24px rgba(245,207,115,.45)}
.stat .l{color:var(--mut);font-size:14px;margin-top:4px;font-weight:700}

/* countdown */
.cd{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 0 34px}
.cd .u{min-width:82px;text-align:center;padding:14px 8px}
.cd .u b{display:block;font-family:'Cinzel Decorative',serif;font-size:32px;color:var(--txt)}
.cd .u span{color:var(--mut);font-size:13px}

/* path of glory */
.path{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;position:relative}
@media(max-width:1200px){.path{grid-template-columns:repeat(3,1fr)}}@media(max-width:1000px){.path{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.path{grid-template-columns:1fr}}
.step{cursor:pointer;transition:transform .35s,box-shadow .35s;overflow:hidden}
.step:hover{transform:translateY(-6px) rotate(-.4deg);box-shadow:0 26px 60px rgba(139,92,246,.35)}
.step .ic{font-size:38px;filter:drop-shadow(0 0 14px rgba(245,207,115,.6));animation:bob 3s ease-in-out infinite}
.step:nth-child(2) .ic{animation-delay:.3s}.step:nth-child(3) .ic{animation-delay:.6s}.step:nth-child(4) .ic{animation-delay:.9s}.step:nth-child(5) .ic{animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-6px)}}
.step .n{position:absolute;top:10px;left:14px;font-family:'Cinzel Decorative',serif;font-size:44px;color:rgba(245,207,115,.08);font-weight:900}
.step h3{font-family:'Aref Ruqaa',serif;font-size:26px;margin:8px 0 2px;color:var(--gold3)}
.step .m{color:var(--mut);font-size:14px}
.step .cc{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:rgba(192,132,252,.1);border:1px solid rgba(192,132,252,.22);font-size:13px;line-height:1.5}
.step.final{background:linear-gradient(160deg,rgba(245,207,115,.18),var(--glass) 60%)}

.champ{margin:0 0 38px;text-align:center;padding:30px 20px;overflow:hidden}
.champ .crown{font-size:56px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 0 20px var(--gold))}
.champ .nm{font-family:'Aref Ruqaa',serif;font-size:clamp(30px,5vw,52px);color:var(--gold);text-shadow:0 0 40px rgba(245,207,115,.6)}
.champ .ph{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:10px auto;border:3px solid var(--gold);box-shadow:0 0 40px var(--gold)}

/* ===== REG ===== */
.reg{display:grid;grid-template-columns:420px 1fr;gap:22px;align-items:start}
@media(max-width:960px){.reg{grid-template-columns:1fr}}
.fl{margin-bottom:14px}
.fl label{display:block;font-size:14px;color:var(--mut);margin-bottom:6px;font-weight:700}
.inp{width:100%;padding:13px 15px;border-radius:13px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--txt);font-size:16px;outline:none;transition:.25s}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(245,207,115,.12);background:rgba(0,0,0,.45)}
select.inp option{background:#140b2b}
textarea.inp{resize:vertical;min-height:90px;line-height:1.7}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upl{display:flex;align-items:center;gap:14px;padding:12px;border:1.5px dashed var(--line2);border-radius:14px;cursor:pointer;transition:.25s;margin-bottom:14px}
.upl:hover{border-color:var(--gold);background:rgba(245,207,115,.05)}
.upl .pv{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:rgba(192,132,252,.12);overflow:hidden;flex:none}
.upl .pv img{width:100%;height:100%;object-fit:cover}
.upl small{color:var(--mut);display:block}
.msg{display:none;margin-top:12px;padding:12px;border-radius:12px;font-weight:700;text-align:center}
.msg.ok{display:block;background:rgba(94,234,212,.12);color:var(--cyan);border:1px solid rgba(94,234,212,.35)}
.msg.err{display:block;background:rgba(251,113,133,.12);color:var(--rose);border:1px solid rgba(251,113,133,.35)}
.closed{text-align:center;padding:40px 20px}
.closed b{font-size:50px;display:block;margin-bottom:10px}

/* ===== SEATS ===== */
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
.seat{position:relative;padding:16px 12px 14px;text-align:center;cursor:default;transition:transform .35s,box-shadow .35s;animation:popIn .5s backwards}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}}
.seat.full:hover{transform:translateY(-6px);box-shadow:0 22px 50px rgba(245,207,115,.18)}
.seat .no{position:absolute;top:10px;right:12px;font-family:'Cinzel Decorative',serif;font-size:13px;color:var(--gold);opacity:.8}
.seat .ph{width:74px;height:74px;margin:4px auto 10px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:900;background:linear-gradient(135deg,#2e1065,#701a75);border:2px solid rgba(245,207,115,.45);overflow:hidden;color:var(--gold3)}
.seat .ph img{width:100%;height:100%;object-fit:cover}
.seat.empty{opacity:.45}
.seat.empty .ph{background:rgba(255,255,255,.04);border-style:dashed;color:var(--mut)}
.seat .tn{font-family:'Aref Ruqaa',serif;font-size:20px;color:var(--gold3);line-height:1.3;min-height:1em}
.seat .nn{font-size:14px;color:var(--txt);line-height:1.7}
.seat .nn span{color:var(--mut)}
.seat.out{filter:grayscale(.8);opacity:.55}
.seat.alive .ph{box-shadow:0 0 22px rgba(94,234,212,.45);border-color:var(--cyan)}
.seat.king .ph{box-shadow:0 0 30px var(--gold);border-color:var(--gold)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{max-width:260px}

/* ===== BRACKET ===== */
.bk-scroll{overflow-x:auto;padding:10px 4px 20px;scrollbar-color:var(--gold2) transparent}
.bk{position:relative;display:flex;gap:12px;direction:ltr;width:max-content;margin:0 auto;padding:14px 6px}
.bk-col{display:flex;flex-direction:column;justify-content:space-around;flex:0 0 128px;width:128px;gap:10px;position:relative;z-index:2}
.bk-col .hd{position:absolute;top:-32px;left:0;right:0;text-align:center;font-family:'Aref Ruqaa',serif;color:var(--gold);font-size:18px;white-space:nowrap}
.bk svg.lines{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:visible}
.mt{direction:rtl;background:rgba(14,8,30,.82);border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.4);transition:.3s;animation:popIn .5s backwards}
.mt:hover{border-color:var(--gold);box-shadow:0 0 24px rgba(245,207,115,.25)}
.tm{display:flex;align-items:center;gap:7px;padding:6px 8px;font-size:12.5px;min-height:36px;transition:.25s;position:relative}
.tm+.tm{border-top:1px solid rgba(255,255,255,.06)}
.tm .a{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:900;background:#2e1065;color:var(--gold3);overflow:hidden}
.tm .a img{width:100%;height:100%;object-fit:cover}
.tm .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.tm .s{font-size:10px;color:var(--mut);font-family:'Cinzel Decorative',serif}
.tm.tbd{color:rgba(169,156,200,.45);font-style:italic}
.tm.win{background:linear-gradient(90deg,rgba(245,207,115,.05),rgba(245,207,115,.22));color:var(--gold3)}
.tm.win::before{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.tm.lose{opacity:.45;text-decoration:line-through}
body.admin .tm.pick{cursor:pointer}
body.admin .tm.pick:hover{background:rgba(94,234,212,.12)}
.mt.final{border:2px solid var(--gold);box-shadow:0 0 50px rgba(245,207,115,.35);transform:scale(1.08)}
.mt.final .tm{font-size:14px;min-height:46px}
.trophy{text-align:center;margin-bottom:14px}
.trophy .t{font-size:58px;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 0 22px var(--gold))}
.trophy .c{font-family:'Aref Ruqaa',serif;color:var(--gold);font-size:22px;min-height:30px;text-shadow:0 0 20px rgba(245,207,115,.6)}
.rtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.rtab{padding:9px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line2);cursor:pointer;font-weight:700;color:var(--mut);transition:.25s}
.rtab.on{background:linear-gradient(135deg,var(--vio),#6d28d9);color:#fff;border-color:transparent;box-shadow:0 8px 24px rgba(139,92,246,.45)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.list .mt .tm{font-size:15px;min-height:48px}
.list .mt .tm .a{width:32px;height:32px}
.mhd{display:flex;justify-content:space-between;padding:6px 10px;font-size:12px;color:var(--mut);background:rgba(245,207,115,.06)}
.rinfo{margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:50px 20px;color:var(--mut)}
.empty b{display:block;font-size:54px;margin-bottom:10px;animation:bob 3s infinite}
.vt{display:flex;gap:6px}

/* ===== RULES ===== */
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.rcard{overflow:hidden}
.rcard .top2{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rcard .bi{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,rgba(245,207,115,.25),rgba(139,92,246,.25));border:1px solid var(--line)}
.rcard h3{font-family:'Aref Ruqaa',serif;font-size:26px;color:var(--gold3)}
.rcard .w{color:var(--mut);font-size:13px}
.rcard ol{list-style:none;counter-reset:c;display:flex;flex-direction:column;gap:8px}
.rcard li{counter-increment:c;display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.05);line-height:1.7}

.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.imgbox{display:flex;align-items:center;gap:12px}
.imgbox .pv{width:84px;height:84px;border-radius:14px;object-fit:cover;background:rgba(255,255,255,.04);border:1px solid var(--line2);flex:none}
.trow{display:grid;grid-template-columns:44px 52px 1fr 1fr 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:12px;background:rgba(0,0,0,.2);margin-bottom:6px}
.trow .no{font-family:'Cinzel Decorative',serif;color:var(--gold);text-align:center}
.trow img,.trow .ph0{width:46px;height:46px;border-radius:50%;object-fit:cover;cursor:pointer;background:rgba(255,255,255,.06);display:grid;place-items:center;border:1px dashed var(--line2)}

.act{display:flex;gap:6px}
.note{font-size:13px;color:var(--mut);line-height:1.8}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700}

.sw input:checked+i{background:var(--cyan)}

/* vote */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.vcard .vs{display:flex;align-items:center;gap:10px;margin:4px 0 12px}

.vopt.mine{border-color:var(--cyan);box-shadow:0 0 18px rgba(94,234,212,.25)}

.cpick{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 10px;border-radius:10px;background:rgba(245,207,115,.12);border:1px solid var(--line);color:var(--gold3);font-size:13px;font-weight:700}

.rq .ph{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#2e1065;display:grid;place-items:center;color:var(--gold3);font-weight:900;flex:none;overflow:hidden}

.mystat{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.fam-hero{text-align:center;padding:26px 18px;margin-bottom:18px}
.fam-hero .lg{width:150px;height:150px;margin:0 auto 12px;border-radius:24px;overflow:hidden;animation:float 6s ease-in-out infinite;box-shadow:0 0 60px rgba(192,132,252,.35)}

.fam-hero .ms{max-width:640px;margin:0 auto;line-height:2;font-size:17px;color:var(--txt);white-space:pre-line}
.fam{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.fam{grid-template-columns:1fr}}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fm{text-align:center;padding:14px 10px;cursor:pointer;transition:transform .3s}
.fm:hover{transform:translateY(-5px)}
.fm .ph{width:70px;height:70px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:26px;font-weight:900;background:linear-gradient(135deg,#4c1d95,#831843);color:#fff;overflow:hidden;border:2px solid rgba(192,132,252,.6);box-shadow:0 0 20px rgba(192,132,252,.3)}
.fm .ph img{width:100%;height:100%;object-fit:cover}
.fm .nm{font-weight:800}
.fm .st{font-size:12px;color:var(--mut);line-height:1.6;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fm.pend{border-style:dashed;opacity:.85}
.badge{display:inline-block;min-width:20px;padding:1px 6px;border-radius:99px;background:var(--rose);color:#fff;font-size:11px;font-weight:900;margin-inline-start:4px;vertical-align:middle}
/* live edit */
body.editing [data-t],body.editing [data-i]{outline:1.5px dashed rgba(251,113,133,.7);outline-offset:3px;cursor:pointer;border-radius:6px}
body.editing [data-t]:hover,body.editing [data-i]:hover{outline-color:var(--rose);background-color:rgba(251,113,133,.08)}

/* modal */
.mbg{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:16px;background:rgba(3,1,10,.75);backdrop-filter:blur(8px)}
.mbg.on{display:grid;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{width:min(520px,100%);max-height:90vh;overflow:auto;animation:secIn .35s}
.modal h3{font-family:'Aref Ruqaa',serif;font-size:26px;color:var(--gold);margin-bottom:12px}
.mbtns{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;margin-top:14px}

.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);z-index:120;padding:12px 20px;border-radius:14px;background:rgba(20,12,40,.95);border:1px solid var(--gold);color:var(--gold3);font-weight:700;opacity:0;pointer-events:none;transition:.35s;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.net{position:fixed;top:78px;left:14px;z-index:70;font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(251,113,133,.15);color:var(--rose);border:1px solid rgba(251,113,133,.4);display:none}
#confetti{position:fixed;inset:0;z-index:110;pointer-events:none}
footer{position:relative;z-index:2;text-align:center;color:var(--mut);padding:30px 16px 20px;font-size:14px}
footer span{font-family:'Aref Ruqaa',serif;font-size:20px;color:var(--gold)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
/* profile */
.seat.full{cursor:pointer}
.seat .cm{position:absolute;bottom:8px;left:10px;font-size:12px;color:var(--mut)}
.modal.wide{width:min(760px,100%)}
.pf-hero{position:relative;text-align:center;padding:22px 10px 16px;margin:-6px -6px 14px;border-radius:16px;background:radial-gradient(circle at 50% 0,rgba(245,207,115,.18),transparent 65%),linear-gradient(180deg,rgba(91,33,182,.35),transparent);overflow:hidden}
.pf-hero::before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(245,207,115,.12),transparent 30%);animation:spin 14s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.pf-ph{position:relative;width:128px;height:128px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;font-size:48px;font-weight:900;color:var(--gold3);background:linear-gradient(135deg,#2e1065,#701a75);border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(245,207,115,.12),0 0 40px rgba(245,207,115,.35);overflow:hidden}
.pf-ph img{width:100%;height:100%;object-fit:cover}
.pf-tn{position:relative;font-family:'Aref Ruqaa',serif;font-size:32px;color:var(--gold3);line-height:1.2}
.pf-nn{position:relative;font-size:18px;margin-top:4px}
.pf-mo{position:relative;font-family:'Aref Ruqaa',serif;color:var(--vio2);font-size:19px;margin-top:8px}
.pf-st{position:relative;display:inline-block;margin-top:10px;padding:5px 14px;border-radius:99px;font-weight:700;font-size:14px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
.pf-st.champ{color:#1a1205;background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2));border:0}
.pf-st.alive{color:var(--cyan);border-color:rgba(94,234,212,.4)}
.pf-st.out{color:var(--rose);border-color:rgba(251,113,133,.35)}
.pf-sec{margin-top:16px}
.pf-sec>b{display:block;font-family:'Aref Ruqaa',serif;font-size:22px;color:var(--gold);margin-bottom:8px}
.pf-bio{line-height:1.9;white-space:pre-wrap;color:var(--txt)}
.pf-path{display:flex;gap:8px;flex-wrap:wrap}
.pf-step{flex:1 1 120px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--glass2);text-align:center;font-size:13px}
.pf-step .r{font-weight:700;color:var(--gold3)}
.pf-step.w{border-color:rgba(94,234,212,.5)}.pf-step.l{border-color:rgba(251,113,133,.45);opacity:.85}.pf-step.p{border-style:dashed}
.cm-list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto;padding-left:4px}
.cm-i{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line2);animation:popIn .35s backwards}
.cm-i .h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);margin-bottom:4px}
.cm-i .h b{color:var(--gold3);font-size:14px}
.cm-i .x{background:none;border:0;color:var(--rose);cursor:pointer;font-size:12px}

.cm-f{display:grid;gap:8px;margin-top:10px}
.cert-pv{width:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);margin:6px 0}
.crow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.crow .t{flex:1;min-width:0}.crow small{color:var(--mut)}
</style>

/* normalize data coming from Firebase (arrays may come back as objects and vice versa) */
function norm(d){
  const b=blank();if(!d||typeof d!=='object')return b;
  const o=Object.assign(b,d);
  o.site=Object.assign(blank().site,d.site||{});o.site.text=o.site.text||{};o.site.img=o.site.img||{};
  if(o.site.gen&&!Array.isArray(o.site.gen))o.site.gen=Object.values(o.site.gen);
  if(!o.site.gen)o.site.gen=[];
  o.rounds=Object.assign(JSON.parse(JSON.stringify(DEF_ROUNDS)),d.rounds||{});if(o.rounds.r8&&o.rounds.r8.name==='دور الـ٨')o.rounds.r8.name='ربع النهائي';
  const tm={};if(d.teams){Object.entries(d.teams).forEach(([k,v])=>{if(v&&+k>=0&&+k<SEATS)tm[+k]=v;});}o.teams=tm;
  o.bracket=Object.assign({started:false,order:[],w:{}},d.bracket||{});
  let ord=o.bracket.order;if(ord&&!Array.isArray(ord)){const a=[];Object.entries(ord).forEach(([k,v])=>a[+k]=v);ord=a;}
  if(o.bracket.started&&(!ord||Object.keys(ord).length<=32))o.bracket={started:false,order:[],w:{},fixed:{}},ord=null; // شجرة قديمة بنظام ٣٢ مقعد
  o.bracket.order=Array.from({length:SEATS},(_,i)=>(ord&&ord[i]!=null)?ord[i]:-1);
  o.bracket.w=o.bracket.w||{};
  o.settings=Object.assign({pin:'1234'},d.settings||{});
  o.bracket.fixed=o.bracket.fixed||{};
  o.nvotes=d.nvotes&&typeof d.nvotes==='object'?d.nvotes:{};
  o.totalVotes=typeof d.totalVotes==='number'?d.totalVotes:0;
  o.family=Object.assign({members:{},message:'',registrationOpen:true,logo:null},d.family||{});o.family.members=o.family.members||{};
  o.requests=d.requests&&typeof d.requests==='object'?d.requests:{};
  const cm={};if(d.comments&&typeof d.comments==='object')Object.entries(d.comments).forEach(([k,v])=>{if(v&&typeof v==='object'&&+k>=0&&+k<SEATS)cm[+k]=v;});o.comments=cm;
  return o;
}

/* ================== BRACKET LOGIC ================== */
const W=(r,i)=>{const v=D.bracket.w[r+'_'+i];return v==null?null:+v;};
function parts(r,i){
  if(r===R0){const o=D.bracket.order;const a=o[2*i],b=o[2*i+1];return[a>=0?a:null,b>=0?b:null];}
  const p=ROUNDS[ROUNDS.indexOf(r)-1];return[W(p,2*i),W(p,2*i+1)];
}
function champion(){return W('r2',0);}
function currentRound(){
  if(!D.bracket.started)return null;
  for(const r of ROUNDS){for(let i=0;i<MATCHES[r];i++){const[a,b]=parts(r,i);if(W(r,i)==null&&(a!=null||b!=null))return r;}}
  return null;
}
function alive(i){
  if(!D.bracket.started)return true;
  for(const r of ROUNDS){for(let m=0;m<MATCHES[r];m++){const[a,b]=parts(r,m);if(a!==i&&b!==i)continue;const w=W(r,m);if(w==null)return true;if(w!==i)return false;}}
  return true;
}
function cascade(){
  let changed=true;
  while(changed){changed=false;
    for(const r of ROUNDS)for(let i=0;i<MATCHES[r];i++){const w=W(r,i);if(w==null)continue;const[a,b]=parts(r,i);if(w!==a&&w!==b){delete D.bracket.w[r+'_'+i];changed=true;}}
  }
}
async function pick(r,i,side){
  if(!isAdmin)return;
  const[a,b]=parts(r,i);const s=side===0?a:b;if(s==null)return;
  const k=r+'_'+i;
  if(W(r,i)===s)delete D.bracket.w[k];else D.bracket.w[k]=s;
  cascade();
  renderBracket();
  await put('bracket',D.bracket);
  if(r==='r2'&&champion()!=null){confetti(260);toast('👑 '+tName(champion())+' بطل الأسطورة!');}
}
function draw(mode){
  const regd=[];for(let i=0;i<SEATS;i++)if(team(i))regd.push(i);
  const ord=Array(SEATS).fill(-1);
  if(mode==='seat'){for(let i=0;i<SEATS;i++)ord[i]=team(i)?i:-1;}
  else{
    for(let i=regd.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[regd[i],regd[j]]=[regd[j],regd[i]];}
    const slots=[];for(let i=0;i<SEATS;i+=2)slots.push(i);for(let i=1;i<SEATS;i+=2)slots.push(i); // وزّع الفرق بحيث ما تتجمع الفراغات
    regd.forEach((s,k)=>ord[slots[k]]=s);
  }
  D.bracket={started:true,order:ord,w:{},fixed:{}};D.nvotes={};
  // تأهل تلقائي لو الخصم فاضي
  for(let i=0;i<MATCHES[R0];i++){const[a,b]=parts(R0,i);if(a!=null&&b==null)D.bracket.w[R0+'_'+i]=a;else if(b!=null&&a==null)D.bracket.w[R0+'_'+i]=b;}
}

function countUp(el,to){const from=+el.dataset.v||0;el.dataset.v=to;const t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f);};requestAnimationFrame(f);}
let cdT=null;
function renderCountdown(){
  clearInterval(cdT);const box=$('cdHome');const sd=D.site.startDate;
  if(!sd){box.innerHTML='';return;}
  const tick=()=>{const ms=new Date(sd)-Date.now();if(isNaN(ms)){box.innerHTML='';return;}
    if(ms<=0){box.innerHTML=`<div class="cd"><div class="card u" style="min-width:240px"><b style="font-size:22px;font-family:'Aref Ruqaa'">🔥 البطولة بدأت!</b></div></div>`;clearInterval(cdT);return;}
    const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
    box.innerHTML=`<div class="cd">${[[d,'يوم'],[h,'ساعة'],[m,'دقيقة'],[s,'ثانية']].map(([v,l])=>`<div class="card u"><b>${String(v).padStart(2,'0')}</b><span>${l}</span></div>`).join('')}</div>`;};
  tick();cdT=setInterval(tick,1000);
}

function matchHTML(r,i,extra=''){
  const[a,b]=parts(r,i);const w=W(r,i);
  const row=(s,side)=>{

    <div class="bk-col" style="flex-basis:184px;width:184px"><div class="hd">${esc(R('r2').name)}</div><div>${ch}${matchHTML('r2',0)}</div></div>
    ${ROUNDS.slice(0,-1).reverse().map(r=>col(r,MATCHES[r]/2,MATCHES[r],R(r).name)).join('')}
    <svg class="lines" id="bkLines"></svg></div></div>`;
  requestAnimationFrame(drawLines);
}
function drawLines(){
  const bk=$('bk'),svg=$('bkLines');if(!bk||!svg)return;
  const B=bk.getBoundingClientRect();let p='',g='';
  const box=id=>{const e=$(id);if(!e)return null;const r=e.getBoundingClientRect();return{l:r.left-B.left,r:r.right-B.left,y:r.top-B.top+r.height/2};};
  ROUNDS.slice(1).forEach((r,ri)=>{const prev=ROUNDS[ri];
    for(let i=0;i<MATCHES[r];i++){const P=box(`m_${r}_${i}`);if(!P)continue;
      [2*i,2*i+1].forEach(ci=>{const C=box(`m_${prev}_${ci}`);if(!C)return;
        const leftSide=C.r<P.l;const x1=leftSide?C.r:C.l,x2=leftSide?P.l:P.r,mx=(x1+x2)/2;
        const d=`M${x1},${C.y} H${mx} V${P.y} H${x2}`;
        if(W(prev,ci)!=null&&W(prev,ci)===(parts(r,i)[ci%2]))g+=`<path d="${d}"/>`;else p+=`<path d="${d}"/>`;});
    }});
  svg.setAttribute('width',B.width);svg.setAttribute('height',B.height);
  svg.innerHTML=`<defs><filter id="gl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <g fill="none" stroke="rgba(192,132,252,.28)" stroke-width="1.5">${p}</g>
    <g fill="none" stroke="#f5cf73" stroke-width="2" filter="url(#gl)" stroke-dasharray="6 6" style="animation:dash 1.2s linear infinite">${g}</g>`;
}
addEventListener('resize',()=>{if(curTab==='bracket'&&view==='tree')drawLines();});

async function importOld(){
  let ps;try{ps=await fb('players');}catch(e){return toast('❌ ما قدرت أقرأ القاعدة القديمة');}
  if(!ps)return toast('ما فيه لاعبين في القاعدة القديمة');
  const arr=[];Object.entries(ps).forEach(([k,p])=>{if(p&&p.registered&&p.name)arr[+k]=p;});
  const plan=[];for(let i=0;i<SEATS;i++){const a=arr[2*i],b=arr[2*i+1];if((a||b)&&!team(i))plan.push([i,a,b]);}
  if(!plan.length)return toast('ما فيه شي جديد للنقل');
  confirmM('نقل اللاعبين القدامى',`بيتعبّى ${plan.length} مقعد من بيانات الموقع القديم. نكمل؟`,async()=>{
    for(const[i,a,b]of plan){D.teams[i]={n1:a?a.name:'',n2:b?b.name:'',team:'',photo:(a&&a.photo)||(b&&b.photo)||'',at:Date.now()};}
    try{await Promise.all(plan.map(([i])=>fb('teams/'+i,'PUT',D.teams[i])));const v=Date.now();await fb('meta/v','PUT',v);lastV=v;cache();toast(`✅ تم نقل ${plan.length} مقعد`);}catch(e){setOnline(false);toast('❌ صار خطأ بالحفظ');}
    renderAll();});
}
const OLD_KEYS=['players','votes','tournament','simMin','clips','events','cheers','config','conditions'];
async function fullReset(fam,site){
  toast('جاري أخذ نسخة احتياطية…');
  const bk={};
  for(const k of [...KEYS,...OLD_KEYS]){try{bk[k]=await fb(k);}catch(e){bk[k]=D[k]??null;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(bk,null,1)],{type:'application/json'}));a.download='kyk_backup_before_reset_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  const pin=D.settings.pin,keepSite=D.site,keepRounds=D.rounds,keepFam=D.family;
  D=blank();D.settings.pin=pin;
  if(!site){D.site=keepSite;D.site.regOpen=true;D.rounds=keepRounds;}
  if(!fam)D.family=keepFam;
  try{
    await Promise.all(OLD_KEYS.map(k=>fb(k,'PUT',null)));
    await fb('totalVotes','PUT',0);
    if(fam)await fb('family','PUT',null);
    await putAll();setOnline(true);
  }catch(x){setOnline(false);toast('ما قدرت أوصل لقاعدة البيانات، حاول مرة ثانية');return;}
  try{localStorage.removeItem('kyk_myreq');}catch(e){}
  renderAll();toast('تم التصفير، نبدأ من جديد ✨');
}
function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='kyk_backup.json';a.click();}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{try{D=norm(JSON.parse(ev.target.result));try{await putAll();}catch(x){setOnline(false);}renderAll();toast('✅ تم الاستيراد');}catch(x){toast('❌ الملف غير صالح');}};r.readAsText(f);}

/* ================== VOTING ================== */
function voteCounts(mid,r){const v=(D.nvotes||{})[mid]||{};const c={};condList(r).forEach(x=>c[x]=0);let tot=0;Object.values(v).forEach(x=>{if(x in c){c[x]++;tot++;}});return{c,tot,mine:v[UID]};}
function matchCond(r,i){const mid=r+'_'+i;const f=(D.bracket.fixed||{})[mid];if(f)return f;const cl=condList(r);
  if(R(r).vote){const{c,tot}=voteCounts(mid,r);if(!tot)return cl.length===1?cl[0]:'';return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];}
  return cl.length===1?cl[0]:'';}
function renderVote(){
  const body=$('voteBody');$('voteTotal').textContent='🗳 '+AR(D.totalVotes||0)+' صوت';
  const open=D.site.votingOpen!==false;
  let adm=isAdmin?`<div class="card" style="margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="sw"><input type="checkbox" ${open?'checked':''} onchange="(async()=>{D.site.votingOpen=this.checked;await put('site/votingOpen',this.checked);renderVote();toast(this.checked?'التصويت مفتوح':'التصويت مقفل');})()"><i></i> التصويت مفتوح</label><span class="note">اضغط "تثبيت" على أي شرط عشان تعتمده للقيم بغض النظر عن الأصوات</span></div>`:'';
  if(!D.bracket.started){body.innerHTML=adm+`<div class="card empty"><b>🗳</b><div style="font-size:18px;font-weight:700;color:var(--txt)">التصويت يبدأ بعد القرعة</div><div>أول ما تنسحب القرعة تقدر تصوّت على شرط كل قيم</div></div>`;return;}
  const items=[];
  ROUNDS.forEach(r=>{for(let i=0;i<MATCHES[r];i++){const[a,b]=parts(r,i);if(a==null||b==null)continue;if(!R(r).vote&&!isAdmin)continue;if(condList(r).length<1)continue;items.push([r,i]);}});
  // الأولوية: القيم اللي ما انلعبت
  items.sort((x,y)=>(W(x[0],x[1])!=null)-(W(y[0],y[1])!=null));
  const live=items.filter(([r,i])=>W(r,i)==null),done=items.filter(([r,i])=>W(r,i)!=null);
  const card=([r,i],k)=>{const mid=r+'_'+i;const[a,b]=parts(r,i);const{c,tot,mine}=voteCounts(mid,r);const fixed=(D.bracket.fixed||{})[mid];const played=W(r,i)!=null;
    const canVote=R(r).vote&&open&&!played&&!mine&&!fixed;const max=Math.max(0,...Object.values(c));
    const side=(s,cls)=>`<div class="tside ${cls}">${avatarHTML(s)}<span>${esc(tName(s))}</span></div>`;
    return`<div class="card vcard" style="animation:popIn .5s ${k*40}ms backwards"><div class="mhd" style="border-radius:10px;margin-bottom:6px"><span>${esc(R(r).icon)} ${esc(R(r).name)} · المواجهة ${i+1}</span><span>${AR(tot)} صوت</span></div>
      <div class="vs">${side(a,'')}<b class="x">VS</b>${side(b,'l')}</div>
      ${R(r).vote?condList(r).map(x=>{const pct=tot?Math.round(c[x]/tot*100):0;return`<div class="vopt ${canVote?'':'dis'} ${mine===x?'mine':''} ${tot&&c[x]===max?'lead':''}" ${canVote?`onclick="castVote('${mid}','${r}',this.dataset.c)"`:''} data-c="${esc(x)}"><span class="bar" style="width:${pct}%"></span><span>${mine===x?'✔ ':''}${esc(x)}</span><small><bdi>${AR(c[x])} صوت · ${AR(pct)}٪</bdi></small>${isAdmin?`<button class="btn sm ghost" style="padding:4px 9px;font-size:12px" onclick="event.stopPropagation();fixCond('${mid}',this.parentNode.dataset.c)">📌 تثبيت</button>`:''}</div>`;}).join(''):`<div class="note">🎁 الشرط تحدده الإدارة</div>${isAdmin?condList(r).map(x=>`<div class="vopt" data-c="${esc(x)}" onclick="fixCond('${mid}',this.dataset.c)"><span>${esc(x)}</span><small>📌 تثبيت</small></div>`).join(''):''}`}
      ${fixed?`<div class="cpick">📌 الشرط المعتمد: ${esc(fixed)}${isAdmin?` <a style="cursor:pointer;color:var(--rose)" onclick="fixCond('${mid}','')">✖</a>`:''}</div>`:(matchCond(r,i)?`<div class="cpick">👑 الأعلى: ${esc(matchCond(r,i))}</div>`:'')}
      ${mine&&!played?`<div class="note" style="margin-top:6px">✔ صوّتت لهذا القيم</div>`:''}${played?`<div class="note" style="margin-top:6px">🏁 انلعب القيم · الفائز ${esc(tName(W(r,i)))}</div>`:''}
      ${isAdmin&&tot?`<div style="margin-top:8px"><button class="btn sm red" onclick="clearVotes('${mid}')">🗑 مسح أصوات القيم</button></div>`:''}</div>`;};
  body.innerHTML=adm+(!open?`<div class="card" style="margin-bottom:14px;text-align:center;color:var(--rose);font-weight:700">🔒 التصويت مقفل حالياً، تقدر تشوف النتائج</div>`:'')+
    (live.length?`<div class="vgrid">${live.map(card).join('')}</div>`:`<div class="card empty"><b>🗳</b>ما فيه قيمات مفتوحة للتصويت الحين</div>`)+
    (done.length?`<div class="h2" style="margin-top:30px"><div><h2 style="font-size:30px">قيمات انلعبت</h2></div></div><div class="vgrid">${done.map(card).join('')}</div>`:'');
}
async function castVote(mid,r,c){
  if(D.site.votingOpen===false)return toast('التصويت مقفل');
  if(((D.nvotes||{})[mid]||{})[UID])return toast('صوّتت لهذا القيم قبل');
  if(!condList(r).includes(c))return;
  D.nvotes[mid]=D.nvotes[mid]||{};D.nvotes[mid][UID]=c;D.totalVotes=(D.totalVotes||0)+1;renderVote();
  try{await fb('nvotes/'+mid+'/'+UID,'PUT',c);let t=await fb('totalVotes');t=(typeof t==='number'?t:0)+1;await fb('totalVotes','PUT',t);D.totalVotes=t;const v=Date.now();await fb('meta/v','PUT',v);lastV=v;cache();setOnline(true);}catch(e){setOnline(false);}
  confetti(70);toast('🗳 وصل صوتك!');renderVote();
}
async function fixCond(mid,c){if(!isAdmin)return;D.bracket.fixed=D.bracket.fixed||{};if(c)D.bracket.fixed[mid]=c;else delete D.bracket.fixed[mid];renderVote();await put('bracket',D.bracket);toast(c?'📌 تم تثبيت الشرط':'تم إلغاء التثبيت');}
function clearVotes(mid){confirmM('مسح الأصوات','تمسح كل أصوات هذا القيم؟',async()=>{const n=Object.keys((D.nvotes||{})[mid]||{}).length;delete D.nvotes[mid];await put('nvotes/'+mid,null);try{let t=await fb('totalVotes');t=Math.max(0,(t||0)-n);await fb('totalVotes','PUT',t);D.totalVotes=t;}catch(e){}renderVote();toast('تم المسح');});}

function fate(i){
  if(!D.bracket.started||!D.bracket.order.includes(i))return{st:'none',r:null,path:[]};
  const path=[];
  for(const r of ROUNDS){let found=false;
    for(let m=0;m<MATCHES[r];m++){const[a,b]=parts(r,m);if(a!==i&&b!==i)continue;found=true;
      const w=W(r,m);path.push({r,opp:a===i?b:a,res:w==null?'p':(w===i?'w':'l')});
      if(w==null)return{st:'alive',r,path};if(w!==i)return{st:'out',r,path};break;}
    if(!found)break;}
  return{st:'champ',r:'r2',path};
}

  x.fillStyle=sg;x.fill();x.shadowBlur=0;
  x.strokeStyle='rgba(255,255,255,.45)';x.lineWidth=2;x.beginPath();x.arc(0,0,sr-14,0,6.283);x.stroke();x.beginPath();x.arc(0,0,sr-46,0,6.283);x.stroke();
  x.direction='ltr';x.fillStyle=C.champ||C.silver?'#2a1a05':'#fff1c4';x.font='700 19px "Cinzel Decorative", serif';x.textAlign='center';x.textBaseline='middle';
  const ring=(String(T('heroTitle')||'INFINITE').toUpperCase()+' ✦ '+new Date().getFullYear()+' ✦ ').repeat(3);const N=Math.min(ring.length,54);
  for(let k=0;k<N;k++){x.save();x.rotate(k/N*6.283);x.fillText(ring[k],0,-(sr-30));x.restore();}
  x.font='900 84px serif';x.fillText('∞',0,4);x.restore();
  x.textBaseline='alphabetic';x.direction='rtl';x.textAlign='center';
  // signature & date
  const sig=(px,label,val,font)=>{x.strokeStyle=hgrad(px-230,px+230,['rgba(0,0,0,0)',G[2],'rgba(0,0,0,0)']);x.lineWidth=2;x.beginPath();x.moveTo(px-230,1420);x.lineTo(px+230,1420);x.stroke();
    x.font=font;x.fillStyle='#fff1c4';x.fillText(val,px,1400);x.font='400 32px Tajawal, sans-serif';x.fillStyle='#a99cc8';x.fillText(label,px,1470);};
  sig(560,'التوقيع',T('certSign'),'400 58px "Aref Ruqaa", serif');
  let dt='';try{dt=new Date().toLocaleDateString('ar-SA-u-ca-gregory-nu-arab',{year:'numeric',month:'long',day:'numeric'});}catch(e){dt=new Date().toLocaleDateString();}
  sig(W0-560,'التاريخ',dt,'500 44px Tajawal, sans-serif');
  x.font='400 26px Tajawal, sans-serif';x.fillStyle='rgba(169,156,200,.75)';
  x.fillText(`المقعد #${AR(i+1)}  ·  ${kind==='champ'?'البطل':kind==='second'?'الوصيف':R(kind).name}  ·  رقم الشهادة KYK-${new Date().getFullYear()}-${String(i+1).padStart(2,'0')}`,cx,1592);
  try{return cv.toDataURL('image/png');}catch(e){return noImg?null:makeCert(i,true);}
}
async function showCert(i){
  modal(`<h3>🏅 الشهادة</h3><div class="empty" style="padding:40px"><b>✨</b>جاري تجهيز الشهادة…</div>`);$('mbox').classList.add('wide');
  const url=await makeCert(i);if(!url){modal(`<h3>🏅 الشهادة</h3><p>ما قدرت أجهز الشهادة</p><div class="mbtns"><button class="btn ghost" onclick="closeM()">إغلاق</button></div>`);return;}
  modal(`<h3>🏅 شهادة ${esc(tName(i))}</h3><img class="cert-pv" src="${url}" alt="">
    <div class="mbtns"><a class="btn" href="${url}" download="${esc('شهادة - '+tName(i))}.png">⬇️ تحميل الشهادة</a><button class="btn ghost" onclick="openProfile(${i})">↩ رجوع للملف</button><button class="btn ghost" onclick="closeM()">إغلاق</button></div>`);
  $('mbox').classList.add('wide');if(certKind(i)==='champ')confetti(160);
}
async function dlCert(i){const url=await makeCert(i);if(!url)return;const a=document.createElement('a');a.href=url;a.download='شهادة - '+tName(i)+'.png';a.click();}
async function dlAllCerts(){const l=[];for(let i=0;i<SEATS;i++)if(team(i)){const f=fate(i);if(f.st==='out'||f.st==='champ')l.push(i);}
  if(!l.length)return toast('ما فيه شهادات جاهزة للحين');toast('⬇️ جاري تحميل '+AR(l.length)+' شهادة…');
  for(const i of l){await dlCert(i);await new Promise(r=>setTimeout(r,500));}}
function certAdminHTML(){
  const rows=[];for(let i=0;i<SEATS;i++){if(!team(i))continue;const f=fate(i);const k=certKind(i);
    const lab=f.st==='champ'?'👑 شهادة البطل':f.st==='out'?(k==='second'?'🥈 الوصافة':'🏅 '+CERT[k].title()+' · '+R(f.r).name):f.st==='alive'?'⚔️ مازال في البطولة':'⏳ قبل القرعة';
    rows.push(`<div class="crow"><div class="t"><b>${esc(tName(i))}</b><br><small>${lab}</small></div><button class="btn sm" onclick="showCert(${i})">👁</button><button class="btn sm ghost" onclick="dlCert(${i})">⬇️</button></div>`);}
  return`<b style="font-size:18px">🏅 الشهادات</b><p class="note" style="margin:8px 0 10px">كل فريق يطلع من البطولة تجهز له شهادة شكر حسب الدور اللي وصله، والبطل له شهادة خاصة باسم العائلة كاملة. الجمهور يقدر يشوفها من ملف الفريق. تقدر تغير اسم العائلة والتوقيع من «الهوية والنصوص».</p>
    <button class="btn" onclick="dlAllCerts()">⬇️ تحميل كل الشهادات الجاهزة</button><div style="margin-top:10px;max-height:420px;overflow:auto">${rows.join('')||'<div class="note">ما فيه فرق مسجلة</div>'}</div>`;
}
document.addEventListener('click',e=>{if(editMode)return;const s=e.target.closest('.seat.full[data-seat]');if(s)openProfile(+s.dataset.seat);});

/* ================== LIVE EDIT ================== */
document.addEventListener('click',e=>{
  if(!editMode)return;

function editText(k){const long=T(k).length>40;modal(`<h3>✏️ ${esc(TEXT_LABELS[k]||k)}</h3>${long?`<textarea class="inp" id="etx" rows="4">${esc(T(k))}</textarea>`:`<input class="inp" id="etx" value="${esc(T(k))}">`}
  <div class="mbtns"><button class="btn" onclick="(async()=>{const v=$('etx').value.trim();if(!v||v===DEF_TEXT['${k}'])delete D.site.text['${k}'];else D.site.text['${k}']=v;closeM();applyTexts();renderTab(curTab);await put('site/text',D.site.text);toast('✅ تم الحفظ');})()">💾 حفظ</button><button class="btn ghost" onclick="closeM()">إلغاء</button></div>`);setTimeout(()=>$('etx')&&$('etx').focus(),50);}
function editImg(k){imgPicker(IMG_LABELS[k]||'صورة',!!D.site.img[k],v=>setImg(k,v),k==='bg'?1600:k==='avatar'?240:700);}
async function setImg(k,v){if(v)D.site.img[k]=v;else delete D.site.img[k];applyTexts();if(curTab==='admin')renderAdmin();await put('site/img/'+k,v||null);toast('✅ تم تحديث الصورة');}
function editSeat(i){const t=D.teams[i]||{};modal(`<h3>المقعد ${i+1}</h3>
  <div class="upl" onclick="teamImg(${i})"><div class="pv">${t.photo?`<img src="${esc(t.photo)}">`:'📷'}</div><div><b>صورة الفريق</b><small>اضغط للتغيير</small></div></div>
  <div class="duo"><div class="fl"><label>الاسم الأول</label><input class="inp" id="t1_${i}" value="${esc(t.n1||'')}"></div><div class="fl"><label>الاسم الثاني</label><input class="inp" id="t2_${i}" value="${esc(t.n2||'')}"></div></div>
  <div class="fl"><label>اسم الفريق</label><input class="inp" id="tt_${i}" value="${esc(t.team||'')}"></div>
  <div class="fl"><label>الشعار (جملة قصيرة تظهر في الملف)</label><input class="inp" id="tm_${i}" maxlength="80" value="${esc(t.motto||'')}"></div>
  <div class="fl"><label>الحكاية / نبذة عن الفريق</label><textarea class="inp" id="tb_${i}" rows="4" maxlength="800">${esc(t.bio||'')}</textarea></div>
  <div class="mbtns"><button class="btn" onclick="saveTeam(${i}).then(()=>{closeM();renderTab(curTab);})">💾 حفظ</button>${team(i)?`<button class="btn red" onclick="closeM();delTeam(${i})">🗑 حذف</button>`:''}<button class="btn ghost" onclick="closeM()">إلغاء</button></div>`);}

/* image picker: upload or URL */
let _imgCb=null,_imgMax=700;
function imgPicker(title,canRemove,cb,max){_imgCb=cb;_imgMax=max||700;modal(`<h3>🖼 ${esc(title)}</h3>
  <label class="upl" for="ipF"><div class="pv">📤</div><div><b>رفع صورة من جهازك</b><small>تتصغر تلقائياً عشان الموقع يبقى سريع</small></div></label><input type="file" id="ipF" accept="image/*" hidden onchange="ipFile(event)">
  <div class="fl"><label>أو حط رابط صورة</label><input class="inp" id="ipU" placeholder="https://..." dir="ltr"></div>
  <div class="mbtns"><button class="btn" onclick="ipUrl()">✔ استخدام الرابط</button>${canRemove?`<button class="btn red" onclick="const c=_imgCb;closeM();c('')">🗑 إزالة</button>`:''}<button class="btn ghost" onclick="closeM()">إلغاء</button></div>`);}
async function ipFile(e){const f=e.target.files[0];if(!f)return;const c=_imgCb;const v=await shrink(f,_imgMax,.78);closeM();c(v);}
function ipUrl(){const v=$('ipU').value.trim();if(!/^https?:\/\//i.test(v))return toast('الرابط لازم يبدأ بـ https://');const c=_imgCb;closeM();c(v);}
function shrink(file,max,q){return new Promise(res=>{const r=new FileReader();r.onload=ev=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};im.src=ev.target.result;};r.readAsDataURL(file);});}

/* modal */
function modal(h){$('mbox').className='card modal';$('mbox').innerHTML=h;$('mbg').classList.add('on');}
function closeM(){$('mbg').classList.remove('on');_pf=null;}
let _cf=null;
function confirmM(t,b,cb){_cf=cb;modal(`<h3>${t}</h3><p style="line-height:1.8">${b}</p><div class="mbtns"><button class="btn red" onclick="closeM();_cf&&_cf()">تأكيد</button><button class="btn ghost" onclick="closeM()">إلغاء</button></div>`);}
addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});

/* ================== FX ================== */
(function stars(){
  const c=$('stars'),x=c.getContext('2d');let W,H,S=[],runes=[];const RU='ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ∞✦';
  const rs=()=>{W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
    S=Array.from({length:Math.min(260,Math.floor(innerWidth*innerHeight/5000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5*devicePixelRatio+.3,p:Math.random()*6.28,s:.4+Math.random()*1.4,v:Math.random()*.15}));
    runes=Array.from({length:innerWidth<700?7:16},()=>({x:Math.random()*W,y:Math.random()*H,ch:RU[Math.floor(Math.random()*RU.length)],sz:(14+Math.random()*22)*devicePixelRatio,v:(.15+Math.random()*.35)*devicePixelRatio,a:Math.random()*6.28}));};
  rs();addEventListener('resize',rs);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let shoot=null;
  const f=t=>{x.clearRect(0,0,W,H);
    S.forEach(s=>{const a=.35+.65*Math.abs(Math.sin(t/1000*s.s+s.p));x.globalAlpha=a;x.fillStyle=s.r>1.4?'#f5cf73':'#e9ddff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill();s.y-=s.v;if(s.y<0)s.y=H;});
    x.textAlign='center';
    runes.forEach(r=>{r.y-=r.v;r.a+=.01;if(r.y<-40)r.y=H+40,r.x=Math.random()*W;x.globalAlpha=.10+.08*Math.sin(r.a);x.fillStyle='#f5cf73';x.font=`${r.sz}px serif`;x.fillText(r.ch,r.x+Math.sin(r.a)*20,r.y);});
    if(!shoot&&Math.random()<.004)shoot={x:Math.random()*W,y:Math.random()*H*.4,l:0};
    if(shoot){shoot.l+=18*devicePixelRatio;const g=x.createLinearGradient(shoot.x+shoot.l,shoot.y+shoot.l*.5,shoot.x+shoot.l-160,shoot.y+shoot.l*.5-80);g.addColorStop(0,'rgba(255,241,196,.9)');g.addColorStop(1,'rgba(255,241,196,0)');x.globalAlpha=1;x.strokeStyle=g;x.lineWidth=2*devicePixelRatio;x.beginPath();x.moveTo(shoot.x+shoot.l,shoot.y+shoot.l*.5);x.lineTo(shoot.x+shoot.l-160,shoot.y+shoot.l*.5-80);x.stroke();if(shoot.l>W*.6)shoot=null;}
    x.globalAlpha=1;if(!reduce)requestAnimationFrame(f);};
  requestAnimationFrame(f);
})();
function confetti(n=150){
  const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#f5cf73','#fff1c4','#c084fc','#8b5cf6','#5eead4','#fb7185'];
  const P=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let fr=0;const f=()=>{x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});if(++fr<170)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);};f();
}
let io=null;
function observe(){if(!('IntersectionObserver'in window)){document.querySelectorAll('.reveal').forEach(e=>e.classList.add('in'));return;}
  if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
  document.querySelectorAll('.reveal:not(.in)').forEach((e,i)=>{e.style.transitionDelay=(i%6)*70+'ms';io.observe(e);});
  setTimeout(()=>document.querySelectorAll('.reveal:not(.in)').forEach(e=>{const r=e.getBoundingClientRect();if(r.top<innerHeight)e.classList.add('in');}),1500);}
// 3D tilt on cards
document.addEventListener('pointermove',e=>{const el=e.target.closest('.step,.seat.full,.rcard');if(!el||matchMedia('(hover:none)').matches)return;const r=el.getBoundingClientRect();const px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;el.style.transform=`perspective(700px) rotateY(${px*8}deg) rotateX(${-py*8}deg) translateY(-5px)`;});
document.addEventListener('pointerout',e=>{const el=e.target.closest('.step,.seat.full,.rcard');if(el&&!el.contains(e.relatedTarget))el.style.transform='';});
const st=document.createElement('style');st.textContent='@keyframes dash{to{stroke-dashoffset:-12}}';document.head.appendChild(st);

go(TABS.some(t=>t[0]===start)?start:'home');
